    <text x="54" y="464" font-family="Inter, Arial" font-size="26" font-weight="950" fill="#ffffff">Blinding Lights</text>
    <text x="54" y="498" font-family="Inter, Arial" font-size="16" fill="#94a3b8">The Weeknd</text>
  </g>

