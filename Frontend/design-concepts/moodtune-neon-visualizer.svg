<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
  <defs>
    <radialGradient id="glow1" cx=".25" cy=".15" r=".7">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#111827" stop-opacity=".25"/>
      <stop offset="1" stop-color="#05030a"/>
    </radialGradient>
    <radialGradient id="glow2" cx=".82" cy=".32" r=".55">
      <stop offset="0" stop-color="#06b6d4" stop-opacity=".62"/>
      <stop offset=".45" stop-color="#ec4899" stop-opacity=".18"/>
      <stop offset="1" stop-color="#05030a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset=".5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a3e635"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="1440" height="900" fill="#05030a"/>
  <rect width="1440" height="900" fill="url(#glow1)"/>
  <rect width="1440" height="900" fill="url(#glow2)"/>
  <circle cx="182" cy="164" r="110" fill="#7c3aed" opacity=".22" filter="url(#blur)"/>
  <circle cx="1198" cy="188" r="130" fill="#06b6d4" opacity=".18" filter="url(#blur)"/>

  <text x="72" y="78" font-family="Inter, Arial" font-size="30" font-weight="900" fill="#ffffff">MoodTune</text>
  <text x="1190" y="78" font-family="Inter, Arial" font-size="15" font-weight="800" fill="#d8b4fe">Home</text>
  <text x="1260" y="78" font-family="Inter, Arial" font-size="15" font-weight="800" fill="#94a3b8">Discover</text>
  <text x="1354" y="78" font-family="Inter, Arial" font-size="15" font-weight="800" fill="#94a3b8">Player</text>

  <text x="122" y="220" font-family="Inter, Arial" font-size="18" font-weight="900" fill="#22d3ee" letter-spacing="3">FEEL IT. PLAY IT.</text>
  <text x="120" y="292" font-family="Inter, Arial" font-size="72" font-weight="950" fill="#ffffff">Music that</text>
  <text x="120" y="372" font-family="Inter, Arial" font-size="72" font-weight="950" fill="url(#neon)">matches your mood</text>
  <text x="124" y="424" font-family="Inter, Arial" font-size="20" fill="#cbd5e1">A bolder home screen focused on mood detection, color, and motion.</text>
  <rect x="120" y="472" width="610" height="68" rx="18" fill="#09090f" stroke="#7c3aed" stroke-width="2"/>
  <text x="152" y="515" font-family="Inter, Arial" font-size="18" fill="#94a3b8">I feel unstoppable tonight...</text>
  <rect x="750" y="472" width="170" height="68" rx="18" fill="url(#neon)"/>
  <text x="796" y="515" font-family="Inter, Arial" font-size="18" font-weight="950" fill="#07070f">Tune Me</text>

  <g transform="translate(970 178)">
