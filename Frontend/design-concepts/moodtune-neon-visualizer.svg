    <text x="28" y="50" font-family="Inter, Arial" font-size="22" font-weight="950" fill="#fb7185">Romantic</text>
    <text x="28" y="82" font-family="Inter, Arial" font-size="14" fill="#e5e7eb">31 tracks</text>
  </g>
  <g transform="translate(772 624)">
